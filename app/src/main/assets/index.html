}

addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=1;if(e.repeat)return;if(S&&S.mode=='intro'&&S.t>.5)S.t=Math.max(S.t,11.5);if(k==' '){if(S&&S.dlg){S.dlg.i=S.dlg.l.length-1;talkNext()}else K('attack')}if(k=='shift')K('dodge');if('1234'.includes(k)&&k)cast(+k);if(k=='e')act();if(k=='i')inv();if(k=='m')worldMap();if(k=='j')journal();if(k=='escape'){if(S&&S.dlg){S.dlg.i=S.dlg.l.length-1;talkNext();return}if(S&&['pause','inv','map','journal','settings'].includes(S.mode)){resume();return}if(S&&S.mode=='game')pause()}});

function pointFromEvent(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function joyStart(e,pt){if(joy.on)return;const size=parseFloat(getComputedStyle(stage).getPropertyValue('--joy-size'))||120;joy={on:1,id:e.pointerId,cx:pt.x,cy:pt.y,dx:0,dy:0,mx:0,my:0,radius:size/(2*fitScale),release:0,rx:0,ry:0};const j=document.getElementById('joy');j.classList.add('active');j.classList.remove('joy-ghost');j.style.left=(pt.x/W*100)+'%';j.style.top=(pt.y/H*100)+'%';j.style.bottom='auto';try{stage.setPointerCapture(e.pointerId)}catch(err){}wakeTouchControls()}
function joyMove(e){if(!joy.on||e.pointerId!==joy.id)return;const pt=pointFromEvent(e),dx=pt.x-joy.cx,dy=pt.y-joy.cy,len=Math.hypot(dx,dy),norm=Math.min(1,len/joy.radius),ux=len?dx/len:0,uy=len?dy/len:0,mag=norm<=.12?0:(norm-.12)/.88;joy.dx=ux*norm;joy.dy=uy*norm;joy.mx=ux*mag;joy.my=uy*mag;const knob=document.getElementById('joyKnob'),cssR=(parseFloat(getComputedStyle(stage).getPropertyValue('--joy-size'))||120)*.27;if(knob)knob.style.transform='translate(calc(-50% + '+(ux*norm*cssR)+'px),calc(-50% + '+(uy*norm*cssR)+'px))'}
function joyEnd(e){if(!joy.on||e.pointerId!==joy.id)return;joy.on=0;joy.id=null;joy.release=.14;joy.rx=joy.mx;joy.ry=joy.my;const j=document.getElementById('joy');j.classList.remove('active');j.classList.add('joy-ghost');j.style.left='15%';j.style.top='auto';j.style.bottom='9%';const k=document.getElementById('joyKnob');if(k)k.style.transform='translate(-50%,-50%)'}

function controlDown(e,button){e.preventDefault();e.stopPropagation();if(!S)return;if(S.mode==='intro'){S.t=Math.max(S.t,11.5);return}if(S.mode!=='game'||S.dlg)return;wakeTouchControls();uiSound();button.classList.add('pressed');try{button.setPointerCapture(e.pointerId)}catch(err){}const id=e.pointerId;
