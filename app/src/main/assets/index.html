<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Legends of Aetheria</title>
<style>
:root{--gold:#e8c46a;--ink:#070b18;--em:#1f6b4f;--par:#f1e4bd}
html,body{margin:0;height:100%;background:#03060f;color:var(--par);font-family:Georgia,'Palatino Linotype',serif;overflow:hidden;touch-action:none;user-select:none}
#g{position:absolute}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,6,15,.72);text-align:center;padding:12px;box-sizing:border-box}
.card{max-width:520px;background:linear-gradient(#111a33,#0a1022);border:2px solid var(--gold);border-radius:6px;padding:22px 26px;box-shadow:0 0 40px #e8c46a44,inset 0 0 30px #000;max-height:92vh;overflow:auto}
h1{font-size:clamp(28px,7vw,54px);margin:0 0 6px;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 22px #ffb84a99;font-weight:400}
h2{margin:0 0 10px;color:var(--gold);font-weight:400;letter-spacing:.06em}
p,li{line-height:1.5;font-size:15px}
button{font:inherit;color:var(--par);background:#1a2548;border:1px solid var(--gold);border-radius:4px;padding:8px 16px;margin:4px;cursor:pointer}
button:hover{background:#2c3a6e}
.big{font-size:20px;padding:12px 34px;background:#3b2a12}
#bar{position:fixed;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:none}
#bar button{pointer-events:auto;min-width:46px;height:46px;padding:0 8px;border-radius:50%;background:#0d1530cc;margin:0}
.it{display:flex;justify-content:space-between;text-align:left;border-bottom:1px solid #ffffff18;padding:2px 0}
</style></head><body>
<canvas id="g"></canvas>
<div id="bar" style="display:none">
<button onclick="K('attack')" title="Attack (Space)">⚔</button><button onclick="K('dodge')" title="Dodge (Shift)">💨</button>
<button onclick="cast(1)" title="Arcane Bolt (1)">✦</button><button onclick="cast(2)" title="Fire (2)">🔥</button><button onclick="cast(3)" title="Heal (3)">✚</button><button onclick="cast(4)" title="Starfall (4)">★</button>
<button onclick="act()" title="Interact (E)" aria-label="Interact">E</button><button onclick="mapScreen()" title="World map (M)" aria-label="World map">M</button><button onclick="inv()" title="Inventory (I)" aria-label="Inventory">🎒</button><button onclick="pause()" title="Pause">❚❚</button></div>
<div id="ov"></div>
<script src="world.js"></script>
<script src="sprites.js"></script>
<script>
const g=document.getElementById('g'),c=g.getContext('2d'),W=960,H=560,ov=document.getElementById('ov'),bar=document.getElementById('bar');
g.width=W;g.height=H;
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const sr=s=>()=>(s=(s*16807)%2147483647)/2147483647;
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);g.style.width=W*k+'px';g.style.height=H*k+'px';g.style.left=(innerWidth-W*k)/2+'px';g.style.top=(innerHeight-H*k)/2+'px'}
addEventListener('resize',fit);fit();
/* ---------- audio ---------- */
let AC;function snd(f,d=.15,t='sine',v=.07,s=.5){try{AC=AC||new AudioContext();const o=AC.createOscillator(),q=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*s),n+d);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function music(){if(S&&S.mode=='game'&&!S.dlg){const sc=S.combat?[220,261,311,294,220,349]:[262,330,392,440,392,330];snd(sc[S.beat++%6],S.combat?.5:1.6,'triangle',S.combat?.05:.03,1)}setTimeout(music,S&&S.combat?260:800)}
/* ---------- data ---------- */
const Z=AetheriaWorld.zones;
const EN={goblin:{h:30,s:75,d:7,c:'#6b9a3c',r:11,x:10,g:4},wolf:{h:26,s:125,d:6,c:'#8a8a98',r:12,x:9,g:3},skel:{h:45,s:65,d:10,c:'#e0dcc8',r:12,x:14,g:6},shade:{h:36,s:95,d:9,c:'#7a4fc8',r:12,x:16,g:5},knight:{h:100,s:55,d:16,c:'#5a6288',r:15,x:30,g:15},dragon:{h:800,s:0,d:0,c:'#b8321e',r:85,x:400,g:300}};
const LOOT={sword1:{n:'Iron Sword',t:'sword',s:4},sword2:{n:'Ember Blade',t:'sword',s:8},shield1:{n:'Oak Shield',t:'shield',s:2},armor1:{n:'Watchman Mail',t:'armor',s:3},armor2:{n:'Dragonscale Vest',t:'armor',s:6},ring1:{n:'Ring of Leaves',t:'ring',s:4},art1:{n:'Moon Pendant',t:'artifact',s:6},staff1:{n:'Oak Staff',t:'staff',s:3}};
const GR=[1,2,4,5];
const IT=[
[{t:'npc',k:'wiz',x:210,y:330},{t:'npc',k:'queen',x:480,y:270},{t:'npc',k:'smith',x:690,y:340},{t:'npc',k:'cap',x:830,y:440},{t:'chest',x:50,y:530,l:'sword1'},{t:'lore',k:'bell',x:135,y:365}],
[{t:'npc',k:'guard',x:300,y:360},{t:'npc',k:'trav',x:620,y:490},{t:'shrine',x:890,y:235},{t:'chest',x:55,y:232,l:'shield1'},{t:'lore',k:'root',x:825,y:480}],
[{t:'npc',k:'pip',x:120,y:330},{t:'cry',x:300,y:270},{t:'cry',x:560,y:500},{t:'cry',x:830,y:300},{t:'mural',x:480,y:235},{t:'chest',x:905,y:530,l:'art1'},{t:'lore',k:'seal',x:700,y:455}],
[{t:'chest',x:70,y:530,l:'armor2',gold:60},{t:'shrine',x:480,y:530},{t:'lore',k:'ash',x:235,y:485}],
[{t:'lore',k:'crown',x:480,y:475}]];
const NP={
wiz:{n:'Merlanth the Wizard',c:'#8b6cff',l:s=>s.st==0?['The stars have begun to vanish one by one. Something beneath the Fallen Castle is drinking their light.','Vyrmgrath, the old storm-dragon, is waking. His dreams poison the forest creatures and weaken the Moon Seal.','Take my Oak Staff. Find Sylwen in the forest, then follow the moon-crystal trail into the ruins.']:['The ley-lines grow brighter as the seal weakens. Keep the crystals close, and do not waste your mana.'],f:s=>{if(s.st==0){give(LOOT.staff1);s.st=1;toast('Main quest started: The Broken Moon Seal')}}},
queen:{n:'Queen Elowen',c:'#ffd76a',l:s=>s.st<2?['My family has guarded the Moon Seal for nine generations. We mistook its silence for safety.','The forest was the first to hear the dragon stirring. Bring me proof that its heart still beats.']:s.st<5?['The moon-crystals were placed to bind Vyrmgrath, not to imprison the forest. Return them to the old seal.','The road east is open. When you reach the valley, watch the ground: the dragon marks its attacks before the fire arrives.']:['The castle bells have not rung since the seal fell. If you can hear them again, Aetheria still has a future.'],f:s=>{if(!s.done.q){s.done.q=1;s.p.gold+=50;toast('Queen’s grant: +50 gold')}}},
smith:{n:'Brannoch the Blacksmith',c:'#ff9a4a',l:s=>s.sq==0?['The goblins stole my moon-iron from the forest road. Three of them carried the ingots east.','Bring me three goblin marks and I will forge the Ember Blade — a weapon made for a dragon’s scales.']:s.sq==1&&s.gk<3?['The trail is still warm. Three goblins, friend. ('+Math.min(s.gk,3)+'/3 marks)']:s.sq==1?['That is the last mark. The Ember Blade is yours; its edge will bite through a dragon’s armor.']:['Keep the blade dry and the hilt warm. A good sword remembers its maker.'],f:s=>{if(s.sq==0)s.sq=1;else if(s.sq==1&&s.gk>=3){s.sq=2;give(LOOT.sword2);xp(20)}}},
cap:{n:'Ser Aldric, Knight Captain',c:'#9fb4ff',l:s=>['A clean bandage and a clear head win more battles than a brave speech.','Rest here, traveler. The eastern gate is watched, but I will open it when the forest path is safe.'],f:s=>{s.p.hp=MH();s.p.mp=MM();toast('Captain Aldric restores you')}} ,
guard:{n:'Sylwen, Forest Guardian',c:'#6bffb0',l:s=>s.done.g?['The roots are quiet now. I can feel the Moon Seal answering from the ruins.']:['I am Sylwen, keeper of the old roots. The corruption is not evil by choice — the dragon’s fever is inside it.','Take my Ring of Leaves. It will soften the forest’s blows. If you find the bound merchant, cut him free.'],f:s=>{if(!s.done.g){s.done.g=1;give(LOOT.ring1);xp(15)}}},
trav:{n:'Bound Merchant',c:'#d9b38c',l:s=>s.done.m?['The road is mine again. I will tell every traveler who freed me.']:['I was carrying lamp-oil to the ruins when the goblins tied me here.','Take my savings. The old stones are dangerous after dusk — look for blue lights and read every inscription.'],f:s=>{if(!s.done.m){s.done.m=1;s.p.gold+=80;xp(25);toast('Merchant rescued! +80 gold')}}},
pip:{n:'Pip, Young Mage',c:'#ff8bd0',l:s=>s.star?['I can feel the seal holding. The dragon still has one weakness: the heart beneath its scales.']:s.st>=3?['Three moon-crystals, three memories: the Queen’s vow, the forest’s promise, and the dragon’s true name. Read the mural to see how they fit.','I have one spell left to teach you. Starfall can strike every nearby foe — save it for the valley.']:['I am mapping the old seal. Find the three moon-crystals first; the mural will not wake without them.','The skeletons guard the broken pieces. A quick dodge is safer than trading hits.'],f:s=>{if(s.st>=3&&!s.star){s.star=1;toast('Learned Starfall!')}}}};
const LORE={
bell:{n:'The Bell-Keeper’s Record',c:'#e8c46a',l:['The first Queen rang the silver bell when the Moon Seal was made.','Its final note was meant to wake the royal line if the seal ever weakened.']},
root:{n:'The Rootheart Stone',c:'#8ecb76',l:['The forest remembers every footstep. It does not hate the lost — it waits for them to find the path home.','Vyrmgrath’s fire has scorched the roots, but the heartwood still carries moonlight.']},
seal:{n:'Tablet of Three Moons',c:'#aebdff',l:['Three crystals hold three promises: courage, mercy, and remembrance.','A seal made only of chains will break. A seal held by a kingdom can be renewed.']},
ash:{n:'The Ashen Waystone',c:'#ff9a63',l:['Here the First Queen learned the dragon’s true name: Vyrmgrath, Storm-Eater.','The valley floor darkens before each flame-burst. Move when the ground glows.']},
crown:{n:'The Crown’s Last Inscription',c:'#f1d27a',l:['The seal cannot be restored by a crown alone. The people must choose to remember one another.','Carry the crystals into the light. Let the dragon see what its long sleep could not destroy.']}};
const QT=s=>['Find Merlanth and learn why the stars are fading.','Cleanse the Enchanted Forest ('+s.fk+'/6); speak with Sylwen.','Recover 3 moon-crystals ('+s.cr+'/3) and wake the mural.','Read the mural, then prepare for the dragon’s valley.','Cross Dragon Valley ('+s.vk+'/7); watch for warning circles.','Enter the Fallen Castle and defeat Vyrmgrath.','Aetheria is saved — tell the story.'][s.st]+(s.sq==1?'  •  Side quest: goblin marks '+Math.min(s.gk,3)+'/3':'')+'  •  Chronicle: '+(s.discoveries?s.discoveries.length:0)+'/5';
/* ---------- biome maps ---------- */
const DEC=AetheriaWorld.makeDecorations(W,H);
function bg(i){return AetheriaWorld.background(i,W,H)}
const BG=[];
/* ---------- state ---------- */
let S=null,keys={},joy={on:0,dx:0,dy:0,cx:0,cy:0,id:null},last=0;
const MH=()=>S.p.mh+(S.eq.ring?S.eq.ring.s*5:0),MM=()=>S.p.mm+(S.eq.artifact?S.eq.artifact.s*3:0);
const ATK=()=>8+(S.eq.sword?S.eq.sword.s:0)+S.p.lv,MAG=()=>6+S.p.mag*3+(S.eq.staff?S.eq.staff.s*2:0),DEF=()=>S.p.def+(S.eq.shield?S.eq.shield.s:0)+(S.eq.armor?S.eq.armor.s:0);
function newGame(){stopControls();S={mode:'intro',t:0,z:0,st:0,gk:0,fk:0,vk:0,cr:0,sq:0,cl:{},op:{},done:{},discoveries:[],beat:0,shake:0,combat:0,star:0,hint:20,gt:0,
p:{x:120,y:420,hp:100,mh:100,mp:60,mm:60,lv:1,xp:0,nx:40,gold:0,sp:0,mag:0,def:0,spd:0,fx:1,fy:0,cd:0,dcd:0,inv:0,dash:0,sw:0},
inv:[],eq:{},es:[],pr:[],ep:[],fx:[],tel:[],dlg:null,toast:null,boss:null,end:0,ff:[],sh:{x:-300,on:0,n:25}};
for(let i=0;i<30;i++)S.ff.push({x:rnd(0,W),y:rnd(220,540),a:rnd(0,7)});
ov.style.display='none';bar.style.display='none';enter(0,120,420)}
function enter(z,x,y){S.z=z;S.p.x=x;S.p.y=y;S.p.moving=false;S.es=[];S.pr=[];S.ep=[];S.tel=[];S.fx=[];S.boss=null;if(!BG[z])BG[z]=bg(z);
if(!S.cl[z]){Z[z].ft.forEach(f=>{for(let i=0;i<f[1];i++)S.es.push(mk(f[0],rnd(400,900),rnd(240,530)))});
if(z==4&&!S.done.boss){S.boss=mk('dragon',720,270);S.boss.a=0;S.es.push(S.boss);snd(70,2,'sawtooth',.15,.5);S.shake=1.2;toast('The Ancient Dragon awakens!')}}}
function mk(t,x,y){const e=EN[t];return{t:t,x:x,y:y,hp:e.h,mh:e.h,cd:rnd(0,1),hit:0,ph:rnd(0,7)}}
function toast(s){S.toast={s:s,l:3}}
function give(it){S.inv.push(it);const cu=S.eq[it.t];if(!cu||cu.s<it.s)S.eq[it.t]=it;toast('Found '+it.n+' (+'+it.s+' '+it.t+')');snd(660,.4,'sine',.08,1.6)}
function xp(n){const p=S.p;p.xp+=n;while(p.xp>=p.nx){p.xp-=p.nx;p.lv++;p.nx=Math.round(p.nx*1.5);p.sp++;p.hp=MH();p.mp=MM();toast('Level '+p.lv+'! +1 skill point (press I)');snd(520,.6,'triangle',.1,2)}}
/* ---------- combat ---------- */
function near(r){let b=null,d=r;S.es.forEach(e=>{const q=dist(e,S.p);if(q<d){d=q;b=e}});return b}
function face(e){if(e){const d=Math.hypot(e.x-S.p.x,e.y-S.p.y)||1;S.p.fx=(e.x-S.p.x)/d;S.p.fy=(e.y-S.p.y)/d}}
function K(a){if(!S||S.mode!='game'||S.dlg)return;const p=S.p;
if(a=='attack'&&p.cd<=0){p.cd=.35;p.sw=.18;face(near(110));snd(220,.12,'square',.05,.4);S.es.forEach(e=>{const r=EN[e.t].r+52;if(dist(e,p)<r&&((e.x-p.x)*p.fx+(e.y-p.y)*p.fy>-10||e.t=='dragon'))hurt(e,ATK()+Math.round(Math.random()*3),1)});spark(p.x+p.fx*40,p.y+p.fy*40,'#fff',6,120)}
if(a=='dodge'&&p.dcd<=0){p.dcd=1;p.dash=.2;p.inv=.3;snd(150,.2,'sine',.05,2)}}
function cast(n){if(!S||S.mode!='game'||S.dlg)return;const p=S.p,cost=[0,8,15,20,40][n];if(n==4&&!S.star)return toast('Starfall is not yet learned');if(p.mp<cost)return toast('Not enough mana');
p.mp-=cost;if(n<3&&n){face(near(420));const sp=n==1?420:300;S.pr.push({x:p.x,y:p.y-8,vx:p.fx*sp,vy:p.fy*sp,l:1.4,k:n,d:(n==1?MAG()+8:MAG()*1.5+10)});snd(n==1?700:300,.3,'sawtooth',.05,.3);ring(p.x,p.y,n==1?'#9a7bff':'#ff8a3a')}
if(n==3){p.hp=Math.min(MH(),p.hp+40+MAG());ring(p.x,p.y,'#7dffb0');spark(p.x,p.y,'#7dffb0',24,90);snd(523,.6,'sine',.08,1.5)}
if(n==4){S.es.forEach(e=>{if(dist(e,p)<150+EN[e.t].r)hurt(e,40+MAG()*2,1)});ring(p.x,p.y,'#c8a6ff',150);spark(p.x,p.y,'#e8d6ff',50,240);S.shake=.5;snd(90,.7,'sawtooth',.1,3)}}
function hurt(e,d,kb){if(e.t=='dragon')d=Math.round(d*.8);e.hp-=d;e.hit=.15;if(kb&&e.t!='dragon'){const a=Math.atan2(e.y-S.p.y,e.x-S.p.x);e.x+=Math.cos(a)*18;e.y+=Math.sin(a)*18}
S.fx.push({t:'txt',x:e.x,y:e.y-EN[e.t].r,s:d,l:.8});spark(e.x,e.y,EN[e.t].c,6,100);snd(160,.1,'square',.05,.5);if(e.hp<=0)die(e)}
function die(e){const d=EN[e.t];S.es=S.es.filter(q=>q!=e);spark(e.x,e.y,d.c,30,200);xp(d.x);S.p.gold+=d.g;S.fx.push({t:'txt',x:e.x,y:e.y-20,s:'+'+d.g+'g',l:1,c:'#ffd76a'});
if(e.t=='goblin')S.gk++;if(S.z==1)S.fk++;if(S.z==3)S.vk++;
if(S.st==1&&S.fk>=6){S.st=2;toast('The ancient path to the ruins opens!')}if(S.st==4&&S.vk>=7){S.st=5;toast('The road to the Fallen Castle opens!')}
if(e.t=='dragon'){S.done.boss=1;S.st=6;S.shake=2;S.ep=[];S.tel=[];snd(60,2.5,'sawtooth',.2,.3);setTimeout(win,2600);for(let i=0;i<5;i++)setTimeout(()=>spark(e.x+rnd(-70,70),e.y+rnd(-40,40),'#ffb040',40,260),i*300)}
if(!S.es.length&&e.t!='dragon')S.cl[S.z]=1}
function dmgP(d){const p=S.p;if(p.inv>0||S.mode!='game')return;p.hp-=Math.max(1,d-DEF());p.inv=.6;S.shake=.25;snd(110,.2,'sawtooth',.08,.5);spark(p.x,p.y,'#ff4a4a',10,120);if(p.hp<=0){S.mode='dead';S.combat=0;stopControls();bar.style.display='none';ov.style.display='flex';ov.innerHTML='<div class="card"><h2>You have fallen</h2><p>Aetheria is not lost yet. Rise again.</p><button class="big" onclick="respawn()">Rise Again</button><button onclick="newGame();intro()">Restart</button></div>'}}
function respawn(){const p=S.p;p.hp=MH()/2;p.mp=MM();p.inv=2;S.mode='game';ov.style.display='none';bar.style.display='flex';S.cl[S.z]=S.z==4?0:S.cl[S.z];enter(S.z==4?3:S.z,60,420)}
/* ---------- fx ---------- */
function spark(x,y,col,n,sp){for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(20,sp);S.fx.push({t:'p',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.3,.9),c:col})}}
function ring(x,y,col,r=60){S.fx.push({t:'r',x:x,y:y,c:col,l:.5,m:r})}
/* ---------- interaction ---------- */
function act(){
if(!S||S.mode!='game')return;
if(S.dlg){talkNext();return}
const p=S.p;let b=null,d=60;
(IT[S.z]||[]).forEach((it,i)=>{it.i=i;const q=dist(it,p);if(q<d&&!S.op[S.z+':'+i]){d=q;b=it}});
if(!b)return;
const key=S.z+':'+b.i;
if(b.t=='npc'){const n=NP[b.k];stopControls();S.dlg={n:n.n,c:n.c,l:n.l(S),i:0,f:n.f};return}
if(b.t=='lore'){
  S.op[key]=1;const entry=LORE[b.k],first=!S.discoveries.includes(b.k);
  if(first){S.discoveries.push(b.k);xp(8);if(S.discoveries.length===5){give(LOOT.art1);toast('Chronicle complete — Moon Pendant found')}}
  stopControls();S.dlg={n:entry.n,c:entry.c,l:entry.l,i:0,f:null};return
}
if(b.t=='chest'){S.op[key]=1;if(b.l)give(LOOT[b.l]);if(b.gold){S.p.gold+=b.gold;toast('+'+b.gold+' gold')}xp(15);spark(b.x,b.y,'#ffd76a',20,120)}
if(b.t=='shrine'){S.op[key]=1;p.hp=MH();p.mp=MM();xp(30);toast('A hidden shrine restores you (+30 xp)');ring(b.x,b.y,'#7dffb0',120)}
if(b.t=='cry'){S.op[key]=1;S.cr++;toast('Moon crystal '+S.cr+'/3');snd(880,.5,'sine',.08,1.5);spark(b.x,b.y,'#9ad0ff',25,140);if(S.cr>=3&&S.st<3){S.st=3;toast('Crystals gathered — study the mural')}}
if(b.t=='mural'){if(S.st<3)return toast('The mural is dark. Gather the crystals first.');stopControls();S.dlg={n:'The Moon-Seal Mural',c:'#c8a6ff',l:['A dragon of storm and flame swallowed the sky.','The First Queen did not bind it with chains. She bound it with three promises remembered by her people.','Carry the crystals to the Fallen Castle. Speak Vyrmgrath’s name, then renew the seal.'],i:0,f:s=>{if(s.st==3){s.st=4;toast('The eastern pass opens: Dragon Valley')}}}}
}
function talkNext(){const d=S.dlg;d.i++;snd(400,.05,'sine',.04,1);if(d.i>=d.l.length){S.dlg=null;if(d.f)d.f(S)}}
/* ---------- update ---------- */
function upd(dt){S.t+=dt;if(S.toast&&(S.toast.l-=dt)<0)S.toast=null;if(S.mode=='intro'){if(S.t>13)startPlay();return}if(S.mode!='game'||S.dlg)return;
const p=S.p;S.hint-=dt;p.cd-=dt;p.dcd-=dt;p.inv-=dt;p.sw-=dt;S.gt-=dt;S.shake=Math.max(0,S.shake-dt);p.mp=Math.min(MM(),p.mp+dt*3);
let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joy.on){mx=joy.dx;my=joy.dy}
const m=Math.hypot(mx,my);p.moving=m>.1;if(m>.1){mx/=Math.max(1,m);my/=Math.max(1,m);const l=Math.hypot(mx,my)||1;p.fx=mx/l;p.fy=my/l}else{mx=my=0}

function inv(){if(!S)return;if(S.mode=='inv'){resume();return}if(S.mode!='game')return;stopControls();S.mode='inv';bar.style.display='none';ov.style.display='flex';drawInv()}
function drawInv(){const p=S.p,e=S.eq;ov.innerHTML='<div class="card" style="width:min(520px,92vw)"><h2>Adventurer — Level '+p.lv+'</h2><p>ATK '+ATK()+' · MAG '+MAG()+' · DEF '+DEF()+' · HP '+MH()+' · Mana '+MM()+' · Gold '+p.gold+'</p><h2 style="font-size:16px">Equipped</h2>'+(['sword','staff','shield','armor','ring','artifact'].map(k=>'<div class="it"><span>'+k+'</span><span>'+(e[k]?e[k].n+' (+'+e[k].s+')':'—')+'</span></div>').join(''))+'<h2 style="font-size:16px;margin-top:10px">Skill points: '+p.sp+'</h2>'+[['mh','Health +20'],['mm','Mana +15'],['mag','Magic +3'],['def','Defense +1'],['spd','Speed']].map(u=>'<button '+(p.sp?'':'disabled')+' onclick="up(\''+u[0]+'\')">'+u[1]+'</button>').join('')+'<p style="font-size:13px">Bag: '+(S.inv.map(i=>i.n).join(', ')||'empty')+'</p><button onclick="worldMap()">World Map (M)</button><button onclick="journal()">Chronicle (J)</button><button class="big" onclick="resume()">Close (Esc)</button></div>'}
function worldMap(){if(!S)return;if(S.mode=='map'){resume();return}if(S.mode!='game'&&S.mode!='inv')return;stopControls();S.mode='map';bar.style.display='none';ov.style.display='flex';const req=[0,1,2,4,5];const rows=Z.map((z,i)=>{const open=i===0||S.st>=req[i],current=i===S.z,done=!!S.cl[i]||(i===0&&S.st>0)||(i===4&&S.done.boss),state=current?'YOU ARE HERE':done?'CLEARED':open?'OPEN':'SEALED';const color=current?'#ffe08a':done?'#83d7a4':open?'#bac9ff':'#8a8792';return '<div class="it" style="padding:7px 2px;color:'+color+'"><b>'+('0'+(i+1)).slice(-2)+' · '+z.n+'</b><span>'+state+'</span></div>'}).join('');ov.innerHTML='<div class="card" style="width:min(540px,92vw)"><h2>Roads of Aetheria</h2><p>'+QT(S)+'</p>'+rows+'<p style="font-size:13px">The eastern road opens as the main quest advances. Explore each region for its Chronicle stone.</p><button onclick="journal()">Chronicle</button><button class="big" onclick="resume()">Return to adventure</button></div>'}
function journal(){if(!S)return;if(!['game','inv','map','journal'].includes(S.mode))return;if(S.mode=='journal'){resume();return}stopControls();S.mode='journal';bar.style.display='none';ov.style.display='flex';const found=S.discoveries||[];const entries=Object.keys(LORE).map(k=>'<div class="it"><span>'+LORE[k].n+'</span><span>'+(found.includes(k)?'REMEMBERED':'UNDISCOVERED')+'</span></div>').join('');ov.innerHTML='<div class="card" style="width:min(540px,92vw)"><h2>Chronicle of the Moon Seal</h2><p><b>Current chapter:</b> '+QT(S)+'</p>'+entries+'<p>Memories found: '+found.length+'/5. Discover all five to recover the Moon Pendant.</p><button onclick="worldMap()">World Map</button><button class="big" onclick="resume()">Return to adventure</button></div>'}
function up(k){const p=S.p;if(!p.sp)return;p.sp--;if(k=='mh'){p.mh+=20;p.hp+=20}else if(k=='mm')p.mm+=15;else p[k]++;drawInv()}
/* ---------- input ---------- */
function stopControls(){
  if(joy.on&&joy.id!=null){try{g.releasePointerCapture(joy.id)}catch(e){}}
  joy={on:0,dx:0,dy:0,cx:0,cy:0,id:null};
  ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].forEach(k=>keys[k]=0);
  if(S&&S.p)S.p.moving=false;
}
function mapScreen(){return worldMap()}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  keys[k]=1;
  if(e.repeat)return;
  if(S&&S.mode=='intro'&&S.t>.5)S.t=Math.max(S.t,11.5);
  if(k==' '){if(S&&S.dlg){S.dlg.i=S.dlg.l.length-1;talkNext()}else K('attack')}
  if(k=='shift')K('dodge');
  if('1234'.includes(k)&&k)cast(+k);
  if(k=='e')act();
  if(k=='i')inv();
  if(k=='m')worldMap();
  if(k=='j')journal();
  if(k=='escape'){
    if(S&&S.dlg){S.dlg.i=S.dlg.l.length-1;talkNext();return}
    if(S&&['pause','inv','map','journal'].includes(S.mode)){resume();return}
    if(S&&S.mode=='game')pause();
  }
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
g.addEventListener('pointerdown',e=>{
  if(!S)return;
  if(S.mode=='intro'){S.t=Math.max(S.t,11.5);return}
  if(S.mode!='game')return;
  if(S.dlg){talkNext();return}
  const r=g.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(e.pointerType=='touch'&&x<W/2){
    if(joy.on&&joy.id!==e.pointerId)return;
    joy={on:1,id:e.pointerId,cx:x,cy:y,dx:0,dy:0};
    try{g.setPointerCapture(e.pointerId)}catch(err){}
  }else if(e.pointerType!='touch'||x>=W/2){K('attack')}
});
g.addEventListener('pointermove',e=>{
  if(!joy.on||e.pointerId!==joy.id)return;
  const r=g.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  const dx=x-joy.cx,dy=y-joy.cy,len=Math.hypot(dx,dy);
  if(len<6){joy.dx=0;joy.dy=0;return}
  const scale=Math.min(1,len/45);joy.dx=dx/len*scale;joy.dy=dy/len*scale;
});
const joyEnd=e=>{if(e.pointerId===joy.id)joy={on:0,dx:0,dy:0,cx:0,cy:0,id:null}};
g.addEventListener('pointerup',joyEnd);g.addEventListener('pointercancel',joyEnd);g.addEventListener('lostpointercapture',joyEnd);
addEventListener('blur',stopControls);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopControls()});
menu();music();requestAnimationFrame(frame);
</script></body></html>
