<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Legends of Aetheria</title>
<style>
:root{--gold:#e8c46a;--ink:#070b18;--em:#1f6b4f;--par:#f1e4bd}
html,body{margin:0;height:100%;background:#03060f;color:var(--par);font-family:Georgia,'Palatino Linotype',serif;overflow:hidden;touch-action:none;user-select:none}
#g{position:absolute}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,6,15,.72);text-align:center;padding:12px;box-sizing:border-box}

.big{font-size:20px;padding:12px 34px;background:#3b2a12}

#bar button{pointer-events:auto;min-width:46px;height:46px;padding:0 8px;border-radius:50%;background:#0d1530cc;margin:0}
.it{display:flex;justify-content:space-between;text-align:left;border-bottom:1px solid #ffffff18;padding:2px 0}
</style></head><body>
<canvas id="g"></canvas>
<div id="bar" style="display:none">
<button onclick="K('attack')" title="Attack (Space)">⚔</button><button onclick="K('dodge')" title="Dodge (Shift)">💨</button>
<button onclick="cast(1)" title="Arcane Bolt (1)">✦</button><button onclick="cast(2)" title="Fire (2)">🔥</button><button onclick="cast(3)" title="Heal (3)">✚</button><button onclick="cast(4)" title="Starfall (4)">★</button>
<button onclick="act()" title="Interact (E)">E</button><button onclick="inv()" title="Inventory (I)">🎒</button><button onclick="pause()" title="Pause">❚❚</button></div>
<div id="ov"></div>
<script src="sprites.js"></script>
<script>

addEventListener('resize',fit);fit();
/* ---------- audio ---------- */
let AC;function snd(f,d=.15,t='sine',v=.07,s=.5){try{AC=AC||new AudioContext();const o=AC.createOscillator(),q=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*s),n+d);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function music(){if(S&&S.mode=='game'&&!S.dlg){const sc=S.combat?[220,261,311,294,220,349]:[262,330,392,440,392,330];snd(sc[S.beat++%6],S.combat?.5:1.6,'triangle',S.combat?.05:.03,1)}setTimeout(music,S&&S.combat?260:800)}
/* ---------- data ---------- */
const Z=[
{n:'Aetheria Village',a:['#0a1230','#2b3a78'],g:['#31502f','#1e3520'],sd:3,ft:[]},
{n:'The Enchanted Forest',a:['#06181a','#134a3f'],g:['#1d4a2c','#0f2a1b'],sd:7,ft:[['goblin',3],['wolf',3]]},
{n:'The Forgotten Ruins',a:['#120f2a','#3b2f6b'],g:['#4a4a55','#2a2a38'],sd:11,ft:[['skel',4],['shade',2]]},
{n:'Dragon Valley',a:['#2a0d10','#7a2c22'],g:['#50352a','#2a1a18'],sd:13,ft:[['skel',2],['knight',2],['shade',3]]},

const GR=[1,2,4,5];
const IT=[
[{t:'npc',k:'wiz',x:210,y:330},{t:'npc',k:'queen',x:480,y:270},{t:'npc',k:'smith',x:690,y:340},{t:'npc',k:'cap',x:830,y:440},{t:'chest',x:50,y:530,l:'sword1'}],
[{t:'npc',k:'guard',x:300,y:360},{t:'npc',k:'trav',x:620,y:490},{t:'shrine',x:890,y:235},{t:'chest',x:55,y:232,l:'shield1'}],
[{t:'npc',k:'pip',x:120,y:330},{t:'cry',x:300,y:270},{t:'cry',x:560,y:500},{t:'cry',x:830,y:300},{t:'mural',x:480,y:235},{t:'chest',x:905,y:530,l:'art1'}],
[{t:'chest',x:70,y:530,l:'armor2',gold:60},{t:'shrine',x:480,y:530}],[]];
const NP={
wiz:{n:'Merlanth the Wizard',c:'#8b6cff',l:s=>s.st==0?['The stars have gone strange, traveler. Magic bleeds across the kingdom.','Take this staff. Follow the road east into the Enchanted Forest and cleanse what has been corrupted.']:['The old magic stirs. Trust your spells... and a steady dodge.'],f:s=>{if(s.st==0){give(LOOT.staff1);s.st=1}}},
queen:{n:'Queen Elowen',c:'#ffd76a',l:s=>['Aetheria has stood a thousand years. Something older now wakes beneath it.',s.st>=4?'They say a dragon sleeps in the valley. Go, and end this.':'Merlanth speaks well of you. Take this gold, adventurer.'],f:s=>{if(!s.done.q){s.done.q=1;s.p.gold+=50;toast('+50 gold')}}},
smith:{n:'Brannoch the Blacksmith',c:'#ff9a4a',l:s=>s.sq==0?['Goblins have stolen my ore. Slay three in the forest and I will forge you the Ember Blade.']:s.sq==1&&s.gk<3?['Three goblins, friend. ('+s.gk+'/3)']:s.sq==1?['Ha! The ore is safe. Here, the Ember Blade.']:['Swing it well.'],f:s=>{if(s.sq==0)s.sq=1;else if(s.sq==1&&s.gk>=3){s.sq=2;give(LOOT.sword2)}}},
cap:{n:'Ser Aldric, Knight Captain',c:'#9fb4ff',l:s=>['Steady, adventurer. Rest by our torches.','Your wounds are mended. Fight smart: dodge, then strike.'],f:s=>{s.p.hp=MH();s.p.mp=MM();toast('Fully restored')}},
guard:{n:'Sylwen, Forest Guardian',c:'#6bffb0',l:s=>['The roots whisper of an old prison. The forest weeps.','Take this ring. The leaves will protect you.'],f:s=>{if(!s.done.g){s.done.g=1;give(LOOT.ring1)}}},
trav:{n:'Bound Merchant',c:'#d9b38c',l:s=>['Bless you! Goblins tied me up. Take my reward.'],f:s=>{if(!s.done.m){s.done.m=1;s.p.gold+=80;xp(25);toast('Merchant rescued! +80 gold')}}},
pip:{n:'Pip, Young Mage',c:'#ff8bd0',l:s=>['I studied these ruins! Three moon crystals hold the seal. Find them, then read the mural.',s.st>=3?'You did it! Let me teach you Starfall. Press 4.':'Careful of the skeletons.'],f:s=>{if(s.st>=3&&!s.star){s.star=1;toast('Learned Starfall!')}}}};
const QT=s=>['Speak with Merlanth in the village.','Cleanse the Enchanted Forest ('+s.fk+'/6).','Gather 3 moon crystals in the ruins ('+s.cr+'/3).','Study the mural in the ruins.','Fight through Dragon Valley ('+s.vk+'/7).','Slay the ancient dragon in the Fallen Castle.','Aetheria is saved!'][s.st]+(s.sq==1?'   Side: goblins '+s.gk+'/3':'');
/* ---------- decor ---------- */
const DEC=Z.map((z,i)=>{const r=sr(z.sd*97),d=[],band=()=>r()<.5?215+r()*105:470+r()*75;
if(i==0){[[330,250],[600,255],[780,250]].forEach(p=>d.push({k:'house',x:p[0],y:p[1],r:34}));[140,400,560,880].forEach(x=>d.push({k:'torch',x:x,y:300,r:0}));for(let j=0;j<5;j++)d.push({k:'tree',x:r()*940+10,y:band(),r:14,s:.8})}
if(i==1)for(let j=0;j<17;j++)d.push({k:'tree',x:r()*920+20,y:band(),r:15,s:1+r()*.5});
if(i==2){for(let j=0;j<8;j++)d.push({k:'pillar',x:r()*900+30,y:band(),r:14});[60,900].forEach(x=>d.push({k:'torch',x:x,y:300,r:0}))}
if(i==3)for(let j=0;j<9;j++)d.push({k:j%2?'dead':'rock',x:r()*900+30,y:band(),r:14});
if(i==4){for(let j=0;j<6;j++)d.push({k:'pillar',x:r()*900+30,y:band(),r:14});[100,300,660,860].forEach(x=>d.push({k:'torch',x:x,y:230,r:0}))}
return d});
function bg(i){const z=Z[i],r=sr(z.sd),o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
let s=x.createLinearGradient(0,0,0,220);s.addColorStop(0,z.a[0]);s.addColorStop(1,z.a[1]);x.fillStyle=s;x.fillRect(0,0,W,H);
for(let j=0;j<90;j++){x.fillStyle=`rgba(255,255,255,${r()*.8})`;x.fillRect(r()*W,r()*150,1.5,1.5)}
x.fillStyle='#f4efd8';x.shadowColor='#cfe0ff';x.shadowBlur=30;x.beginPath();x.arc(780,70,28,0,7);x.fill();x.shadowBlur=0;
[[.5,'#141b3a',150],[.8,'#0b1128',190]].forEach(m=>{x.fillStyle=m[1];x.beginPath();x.moveTo(0,215);for(let px=0;px<=W;px+=40)x.lineTo(px,m[2]-r()*90*m[0]-30);x.lineTo(W,215);x.fill()});
if(i==0){x.fillStyle='#070c1c';x.fillRect(370,70,220,145);[[350,40,60],[420,20,60],[520,20,60],[590,40,60]].forEach(t=>{x.fillRect(t[0],t[1],40,t[2]+105);x.beginPath();x.moveTo(t[0]-6,t[1]);x.lineTo(t[0]+20,t[1]-38);x.lineTo(t[0]+46,t[1]);x.fill()});x.fillStyle='#ffc766';for(let j=0;j<14;j++)x.fillRect(380+r()*200,90+r()*100,5,8)}
if(i==2){x.fillStyle='#0b0f24';for(let j=0;j<5;j++){x.fillRect(120+j*170,110,22,105);x.beginPath();x.arc(131+j*170+85,110,85,Math.PI,0);x.lineWidth=18;x.strokeStyle='#0b0f24';x.stroke()}}
if(i==3){x.fillStyle='#050510';x.beginPath();x.moveTo(60,215);x.lineTo(140,60);x.lineTo(230,215);x.fill();x.beginPath();x.ellipse(140,58,16,8,0,0,7);x.moveTo(126,52);x.lineTo(112,30);x.lineTo(138,50);x.moveTo(154,52);x.lineTo(176,32);x.lineTo(148,50);x.fill();x.fillStyle='#ff5a1f';x.fillRect(143,55,3,3)}
if(i==4){x.fillStyle='#08081a';x.fillRect(200,60,560,155);for(let j=0;j<8;j++)x.fillRect(200+j*75,40+(j%3)*20,34,60);x.clearRect(430,110,100,105);x.fillStyle='#050510';x.fillRect(420,90,120,10)}
s=x.createLinearGradient(0,210,0,H);s.addColorStop(0,z.g[0]);s.addColorStop(1,z.g[1]);x.fillStyle=s;x.fillRect(0,210,W,H);
x.fillStyle='#ffffff10';for(let j=0;j<160;j++)x.fillRect(r()*W,215+r()*340,2+r()*4,1.5);
x.fillStyle='#00000030';x.fillRect(0,340,W,55);x.fillStyle='#ffffff10';x.fillRect(0,345,W,45);
return o}
const BG=[];
/* ---------- state ---------- */
let S=null,keys={},joy={on:0,dx:0,dy:0,ox:0,oy:0},last=0;
const MH=()=>S.p.mh+(S.eq.ring?S.eq.ring.s*5:0),MM=()=>S.p.mm+(S.eq.artifact?S.eq.artifact.s*3:0);
const ATK=()=>8+(S.eq.sword?S.eq.sword.s:0)+S.p.lv,MAG=()=>6+S.p.mag*3+(S.eq.staff?S.eq.staff.s*2:0),DEF=()=>S.p.def+(S.eq.shield?S.eq.shield.s:0)+(S.eq.armor?S.eq.armor.s:0);
function newGame(){S={mode:'intro',t:0,z:0,st:0,gk:0,fk:0,vk:0,cr:0,sq:0,cl:{},op:{},done:{},beat:0,shake:0,combat:0,star:0,hint:20,gt:0,
p:{x:120,y:420,hp:100,mh:100,mp:60,mm:60,lv:1,xp:0,nx:40,gold:0,sp:0,mag:0,def:0,spd:0,fx:1,fy:0,cd:0,dcd:0,inv:0,dash:0,sw:0},
inv:[],eq:{},es:[],pr:[],ep:[],fx:[],tel:[],dlg:null,toast:null,boss:null,end:0,ff:[],sh:{x:-300,on:0,n:25}};
for(let i=0;i<30;i++)S.ff.push({x:rnd(0,W),y:rnd(220,540),a:rnd(0,7)});
ov.style.display='none';bar.style.display='none';enter(0,120,420)}
function enter(z,x,y){S.z=z;S.p.x=x;S.p.y=y;S.es=[];S.pr=[];S.ep=[];S.tel=[];S.fx=[];S.boss=null;if(!BG[z])BG[z]=bg(z);
if(!S.cl[z]){Z[z].ft.forEach(f=>{for(let i=0;i<f[1];i++)S.es.push(mk(f[0],rnd(400,900),rnd(240,530)))});
if(z==4&&!S.done.boss){S.boss=mk('dragon',720,270);S.boss.t=0;S.boss.a=0;S.es.push(S.boss);snd(70,2,'sawtooth',.15,.5);S.shake=1.2;toast('The Ancient Dragon awakens!')}}}
function mk(t,x,y){const e=EN[t];return{t:t,x:x,y:y,hp:e.h,mh:e.h,cd:rnd(0,1),hit:0,ph:rnd(0,7)}}
function toast(s){S.toast={s:s,l:3}}
function give(it){S.inv.push(it);const cu=S.eq[it.t];if(!cu||cu.s<it.s)S.eq[it.t]=it;toast('Found '+it.n+' (+'+it.s+' '+it.t+')');snd(660,.4,'sine',.08,1.6)}
function xp(n){const p=S.p;p.xp+=n;while(p.xp>=p.nx){p.xp-=p.nx;p.lv++;p.nx=Math.round(p.nx*1.5);p.sp++;p.hp=MH();p.mp=MM();toast('Level '+p.lv+'! +1 skill point (press I)');snd(520,.6,'triangle',.1,2)}}
/* ---------- combat ---------- */
function near(r){let b=null,d=r;S.es.forEach(e=>{const q=dist(e,S.p);if(q<d){d=q;b=e}});return b}
function face(e){if(e){const d=Math.hypot(e.x-S.p.x,e.y-S.p.y)||1;S.p.fx=(e.x-S.p.x)/d;S.p.fy=(e.y-S.p.y)/d}}
function K(a){if(!S||S.mode!='game'||S.dlg)return;const p=S.p;
if(a=='attack'&&p.cd<=0){p.cd=.35;p.sw=.18;face(near(110));snd(220,.12,'square',.05,.4);S.es.forEach(e=>{const r=EN[e.t].r+52;if(dist(e,p)<r&&((e.x-p.x)*p.fx+(e.y-p.y)*p.fy>-10||e.t=='dragon'))hurt(e,ATK()+Math.round(Math.random()*3),1)});spark(p.x+p.fx*40,p.y+p.fy*40,'#fff',6,120)}
if(a=='dodge'&&p.dcd<=0){p.dcd=1;p.dash=.2;p.inv=.3;snd(150,.2,'sine',.05,2)}}
function cast(n){if(!S||S.mode!='game'||S.dlg)return;const p=S.p,cost=[0,8,15,20,40][n];if(n==4&&!S.star)return toast('Starfall is not yet learned');if(p.mp<cost)return toast('Not enough mana');
p.mp-=cost;if(n<3&&n){face(near(420));const sp=n==1?420:300;S.pr.push({x:p.x,y:p.y-8,vx:p.fx*sp,vy:p.fy*sp,l:1.4,k:n,d:(n==1?MAG()+8:MAG()*1.5+10)});snd(n==1?700:300,.3,'sawtooth',.05,.3);ring(p.x,p.y,n==1?'#9a7bff':'#ff8a3a')}
if(n==3){p.hp=Math.min(MH(),p.hp+40+MAG());ring(p.x,p.y,'#7dffb0');spark(p.x,p.y,'#7dffb0',24,90);snd(523,.6,'sine',.08,1.5)}
if(n==4){S.es.forEach(e=>{if(dist(e,p)<150+EN[e.t].r)hurt(e,40+MAG()*2,1)});ring(p.x,p.y,'#c8a6ff',150);spark(p.x,p.y,'#e8d6ff',50,240);S.shake=.5;snd(90,.7,'sawtooth',.1,3)}}
function hurt(e,d,kb){if(e.t=='dragon')d=Math.round(d*.8);e.hp-=d;e.hit=.15;if(kb&&e.t!='dragon'){const a=Math.atan2(e.y-S.p.y,e.x-S.p.x);e.x+=Math.cos(a)*18;e.y+=Math.sin(a)*18}
S.fx.push({t:'txt',x:e.x,y:e.y-EN[e.t].r,s:d,l:.8});spark(e.x,e.y,EN[e.t].c,6,100);snd(160,.1,'square',.05,.5);if(e.hp<=0)die(e)}
function die(e){const d=EN[e.t];S.es=S.es.filter(q=>q!=e);spark(e.x,e.y,d.c,30,200);xp(d.x);S.p.gold+=d.g;S.fx.push({t:'txt',x:e.x,y:e.y-20,s:'+'+d.g+'g',l:1,c:'#ffd76a'});
if(e.t=='goblin')S.gk++;if(S.z==1)S.fk++;if(S.z==3)S.vk++;
if(S.st==1&&S.fk>=6){S.st=2;toast('The ancient path to the ruins opens!')}if(S.st==4&&S.vk>=7){S.st=5;toast('The road to the Fallen Castle opens!')}
if(e.t=='dragon'){S.done.boss=1;S.st=6;S.shake=2;S.ep=[];S.tel=[];snd(60,2.5,'sawtooth',.2,.3);setTimeout(win,2600);for(let i=0;i<5;i++)setTimeout(()=>spark(e.x+rnd(-70,70),e.y+rnd(-40,40),'#ffb040',40,260),i*300)}
if(!S.es.length&&e.t!='dragon')S.cl[S.z]=1}
function dmgP(d){const p=S.p;if(p.inv>0||S.mode!='game')return;p.hp-=Math.max(1,d-DEF());p.inv=.6;S.shake=.25;snd(110,.2,'sawtooth',.08,.5);spark(p.x,p.y,'#ff4a4a',10,120);if(p.hp<=0){S.mode='dead';S.combat=0;ov.style.display='flex';ov.innerHTML='<div class="card"><h2>You have fallen</h2><p>Aetheria is not lost yet. Rise again.</p><button class="big" onclick="respawn()">Rise Again</button><button onclick="newGame();intro()">Restart</button></div>'}}
function respawn(){const p=S.p;p.hp=MH()/2;p.mp=MM();p.inv=2;S.mode='game';ov.style.display='none';S.cl[S.z]=S.z==4?0:S.cl[S.z];enter(S.z==4?3:S.z,60,420)}
/* ---------- fx ---------- */
function spark(x,y,col,n,sp){for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(20,sp);S.fx.push({t:'p',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.3,.9),c:col})}}
function ring(x,y,col,r=60){S.fx.push({t:'r',x:x,y:y,c:col,l:.5,m:r})}
/* ---------- interaction ---------- */
function act(){if(!S||S.mode!='game')return;if(S.dlg)return talkNext();const p=S.p;let b=null,d=60;(IT[S.z]||[]).forEach((it,i)=>{it.i=i;const q=dist(it,p);if(q<d&&!S.op[S.z+':'+i]){d=q;b=it}});if(!b)return;const key=S.z+':'+b.i;
if(b.t=='npc'){const n=NP[b.k];S.dlg={n:n.n,c:n.c,l:n.l(S),i:0,f:n.f}}

if(S){upd(dt);c.save();if(S.shake>0)c.translate(rnd(-1,1)*S.shake*7,rnd(-1,1)*S.shake*7);if(S.mode=='intro')drawIntro();else{drawScene();}c.restore();if(S.mode!='intro')hud()}else{c.fillStyle='#050912';c.fillRect(0,0,W,H)}
requestAnimationFrame(frame)}
/* ---------- screens ---------- */
function menu(){S=null;ov.style.display='flex';ov.innerHTML='<div class="card"><h1>LEGENDS<br>OF AETHERIA</h1><p>A dragon stirs beneath a kingdom of moonlit stone. Explore five realms, master arcane fire, and face the ancient wyrm.</p><button class="big" onclick="newGame()">Begin the Journey</button><p style="font-size:13px;opacity:.85"><b>Desktop:</b> WASD/arrows move · Space attack · Shift dodge · 1 Arcane Bolt · 2 Fire · 3 Heal · 4 Starfall (learn it later) · E talk/interact · I inventory<br><b>Mobile:</b> drag the left side to move; use the round buttons.</p></div>'}
function intro(){}
function startPlay(){S.mode='game';bar.style.display='flex';S.t=0}
function win(){S.mode='end';bar.style.display='none';ov.style.display='flex';ov.innerHTML='<div class="card"><h1>VICTORY</h1><p>The dragon falls, and moonlight returns to Aetheria. Bells ring from the castle village as your legend begins.</p><p>Level '+S.p.lv+' · '+S.p.gold+' gold · '+S.inv.length+' treasures</p><button class="big" onclick="newGame()">Play Again</button></div>'}
function pause(){if(!S||S.mode!='game')return;S.mode='pause';ov.style.display='flex';ov.innerHTML='<div class="card"><h2>Paused</h2><button class="big" onclick="resume()">Resume</button><button onclick="newGame()">Restart</button><button onclick="menu()">Main menu</button></div>'}
function resume(){S.mode='game';ov.style.display='none'}
function inv(){if(!S||(S.mode!='game'&&S.mode!='inv'))return;if(S.mode=='inv')return resume();S.mode='inv';ov.style.display='flex';drawInv()}
function drawInv(){const p=S.p,e=S.eq;ov.innerHTML='<div class="card" style="width:min(460px,92vw)"><h2>Adventurer — Level '+p.lv+'</h2><p>ATK '+ATK()+' · MAG '+MAG()+' · DEF '+DEF()+' · HP '+MH()+' · Mana '+MM()+' · Gold '+p.gold+'</p><h2 style="font-size:16px">Equipped</h2>'+(['sword','staff','shield','armor','ring','artifact'].map(k=>'<div class="it"><span>'+k+'</span><span>'+(e[k]?e[k].n+' (+'+e[k].s+')':'—')+'</span></div>').join(''))+'<h2 style="font-size:16px;margin-top:10px">Skill points: '+p.sp+'</h2>'+[['mh','Health +20'],['mm','Mana +15'],['mag','Magic +3'],['def','Defense +1'],['spd','Speed']].map(u=>'<button '+(p.sp?'':'disabled')+' onclick="up(\''+u[0]+'\')">'+u[1]+'</button>').join('')+'<p style="font-size:13px">Bag: '+(S.inv.map(i=>i.n).join(', ')||'empty')+'</p><button class="big" onclick="resume()">Close</button></div>'}
function up(k){const p=S.p;if(!p.sp)return;p.sp--;if(k=='mh'){p.mh+=20;p.hp+=20}else if(k=='mm')p.mm+=15;else p[k]++;drawInv()}
/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(S&&S.mode=='intro'&&S.t>.5){S.t=Math.max(S.t,11.5)}
if(k==' '){e.preventDefault();S&&S.dlg?talkNext():K('attack')}if(k=='shift')K('dodge');if('1234'.includes(k)&&k)cast(+k);if(k=='e')act();if(k=='i')inv();if(k=='escape'){S&&S.mode=='pause'?resume():pause()}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
g.addEventListener('pointerdown',e=>{if(!S)return;if(S.mode=='intro'){S.t=Math.max(S.t,11.5);return}if(S.dlg)return talkNext();const r=g.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(e.pointerType=='touch'&&x<W/2){joy={on:1,id:e.pointerId,cx:x,cy:y,dx:0,dy:0};g.setPointerCapture(e.pointerId)}else if(S.mode=='game')K('attack')});
g.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!=joy.id)return;const r=g.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H,dx=x-joy.cx,dy=y-joy.cy,m=Math.max(1,Math.hypot(dx,dy)/45);joy.dx=dx/45/m;joy.dy=dy/45/m});
const je=e=>{if(e.pointerId==joy.id)joy={on:0,dx:0,dy:0}};g.addEventListener('pointerup',je);g.addEventListener('pointercancel',je);
menu();music();requestAnimationFrame(frame);
</script></body></html>
